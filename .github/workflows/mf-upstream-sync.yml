name: mf-upstream-sync

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MF_SYNC_TOKEN || github.token }}
      - name: Merge upstream main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.MF_SYNC_TOKEN || github.token }}
        run: |
          set +e
          git config user.name mf-sync-bot
          git config user.email mf-sync@users.noreply.github.com
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream main
          branch="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git merge --no-edit upstream/main
          status=$?
          if [ "$status" -ne 0 ]; then
            git merge --abort || true
            gh issue create --title "upstream sync conflict $(date +%F)" --body "自动合并 ZhuLinsen/daily_stock_analysis/main 发生冲突，请人工处理。" || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -u origin "$branch"
          gh pr create --title "sync: upstream $(date +%F)" --body "自动同步上游 ZhuLinsen/daily_stock_analysis。" --base main --head "$branch" || true
